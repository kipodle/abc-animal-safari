<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="w" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="14"/>
  </filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="2" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.5 -0.12"/>
  </filter>
</defs>
<rect width="420" height="640" fill="#fffaf0"/>
<g filter="url(#w)"><ellipse cx="60" cy="60" rx="170" ry="120" fill="#f9c9d2" opacity=".62"/><ellipse cx="360" cy="90" rx="160" ry="110" fill="#bfe1f4" opacity=".62"/><ellipse cx="240" cy="230" rx="210" ry="120" fill="#fbe49b" opacity=".62"/><ellipse cx="50" cy="380" rx="180" ry="130" fill="#cfe9c5" opacity=".62"/><ellipse cx="350" cy="450" rx="170" ry="120" fill="#e1d3f7" opacity=".62"/><ellipse cx="200" cy="560" rx="190" ry="100" fill="#ffd8b0" opacity=".62"/></g>
<rect width="420" height="640" filter="url(#paper)" opacity=".5"/>
</svg>
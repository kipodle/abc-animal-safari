<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard – Hog the Hedgehog</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/accounts.css">
<style>
  .dash{ padding-block:24px 36px; }
  .dash h1{ font-family:"Baloo 2",sans-serif; font-weight:800; margin:0 0 4px; font-size:clamp(1.8rem,5vw,2.5rem); color:var(--green-deep); }
  .dash .sub{ color:var(--ink-soft); font-weight:700; margin:0 0 22px; }
  .stat-grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .stat{ background:var(--card); border:2px solid var(--card-edge); border-radius:20px; padding:18px 20px; box-shadow:0 5px 0 var(--card-edge); }
  .stat h3{ margin:0 0 4px; font-size:1rem; color:var(--ink-soft); }
  .stat .big{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:2.8rem; line-height:1.05; }
  .stat ul{ list-style:none; margin:8px 0 0; padding:0; font-weight:700; color:var(--ink-soft); font-size:.93rem; line-height:1.7; }
  .stat li b{ color:var(--ink); }
  .panel{ background:var(--card); border:2px solid var(--card-edge); border-radius:20px; padding:18px 20px; margin-top:18px; }
  .panel h2{ margin:0 0 12px; font-size:1.2rem; font-family:"Baloo 2",sans-serif; }
  .charts{ display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .chart h4{ margin:0 0 4px; font-size:.95rem; display:flex; justify-content:space-between; gap:8px; }
  .chart svg{ width:100%; height:64px; display:block; }
  .chart rect{ fill:currentColor; }
  .chart .axis{ display:flex; justify-content:space-between; font-size:.75rem; color:var(--ink-soft); font-weight:700; }
  .c-green{ color:var(--green); } .c-coral{ color:var(--coral); } .c-blue{ color:var(--blue); } .c-gold{ color:var(--gold-deep); }
  .toplist{ display:flex; gap:10px; flex-wrap:wrap; }
  .toplist span{ background:var(--bg2); border-radius:999px; padding:6px 14px; font-weight:800; }
  .gate{ text-align:center; padding:50px 10px; }
  .gate p{ color:var(--ink-soft); font-weight:700; max-width:52ch; margin:0 auto 16px; }
  .gate code{ background:var(--bg2); padding:2px 6px; border-radius:6px; word-break:break-all; }
  .tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted{ color:var(--ink-soft); font-weight:700; font-size:.9rem; }
  .countries{ display:grid; gap:8px; }
  .crow{ display:grid; grid-template-columns:minmax(90px,170px) 1fr 44px; align-items:center; gap:10px; font-weight:700; }
  .crow b{ text-align:right; }
  .ctrack{ background:var(--bg2); border-radius:999px; height:12px; overflow:hidden; display:block; }
  .cbar{ display:block; height:100%; background:var(--green); border-radius:999px; min-width:4px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img class="logo-img" src="/assets/logo.png" alt="" width="61" height="46"><span>Hog the Hedgehog</span></a>
  </div>
</header>

<main class="wrap dash">
  <h1>📊 Dashboard</h1>
  <p class="sub">Members, logins, return visits, countries and downloads at a glance.</p>
  <div id="view"><div class="gate"><p>Loading…</p></div></div>
</main>

<script src="/assets/countries.js"></script>
<script src="/assets/accounts.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
